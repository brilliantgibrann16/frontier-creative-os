# CI gate for frontier-creative-os (Wave 0, programs P01 / P11 / P13 frame).
#
# Governing artifacts: RFC-0011 disposition E-A per ADR-0004 (gates encoded
# in CI), Constitution Article 9 (no release before CI), Baseline L-5 and
# Blueprint INV-19 (identical gates for human and AI contributions).
#
# Python 3.11 and pytest match the repository's existing test conventions
# (see docs/program/TESTING_CONVENTIONS.md). The prototype and the checks
# are standard-library only; pytest is the sole installed dependency.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Prototype and tooling tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run test suite
        run: python -m pytest tests/ -v

  docs-checks:
    name: Documentation gates (links, IDs)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Internal link check
        run: python tools/checks/check_links.py
      - name: Governance ID reference check
        run: python tools/checks/check_ids.py
