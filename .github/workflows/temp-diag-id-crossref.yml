# TEMPORARY diagnostic workflow -- NOT permanent CI infrastructure.
#
# Purpose: the sandbox driving this repair has no Python runtime and no
# Actions log/artifact API access, so this workflow makes the CI runner
# itself produce the authoritative derive_id_crossref output for the
# PR #46 tree and commit it back to the PR branch, where the exact
# bytes can be read and hash-verified through the contents API.
#
# It must be REMOVED from the PR before merge, together with
# tests/test_diag_id_crossref_probe.py.

name: TEMP diag - regenerate ID_CROSSREF with the real generator

on:
  push:
    branches:
      - rfc/0020-stage1-wb-clause-set
    paths:
      - ".github/workflows/temp-diag-id-crossref.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: rfc/0020-stage1-wb-clause-set

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Diagnose committed vs generated (real generator, run twice)
        run: |
          set -euxo pipefail
          DIAG=/tmp/fcos-id-crossref-diagnostic
          mkdir -p "$DIAG"
          cp docs/derived/ID_CROSSREF.md "$DIAG/ID_CROSSREF.committed.md"
          python tools/docs/build_docs.py
          cp docs/derived/ID_CROSSREF.md "$DIAG/ID_CROSSREF.generated.pass1.md"
          python tools/docs/build_docs.py
          cp docs/derived/ID_CROSSREF.md "$DIAG/ID_CROSSREF.generated.md"
          {
            echo "=== determinism: pass1 vs pass2 ==="
            cmp "$DIAG/ID_CROSSREF.generated.pass1.md" "$DIAG/ID_CROSSREF.generated.md" && echo "byte-identical across two builds"
            echo "=== sha256 ==="
            sha256sum "$DIAG/ID_CROSSREF.committed.md" "$DIAG/ID_CROSSREF.generated.md"
            echo "=== byte counts ==="
            wc -c "$DIAG/ID_CROSSREF.committed.md" "$DIAG/ID_CROSSREF.generated.md"
            echo "=== unified diff (committed -> generated) ==="
            diff -u "$DIAG/ID_CROSSREF.committed.md" "$DIAG/ID_CROSSREF.generated.md" || true
            echo "=== final 10 generated lines ==="
            tail -n 10 "$DIAG/ID_CROSSREF.generated.md"
            echo "=== trailing byte (xxd of last 16 bytes) ==="
            tail -c 16 "$DIAG/ID_CROSSREF.generated.md" | xxd
            echo "=== build --check after regeneration ==="
            python tools/docs/build_docs.py --check
          } | tee "$DIAG/diagnostic.txt"

      - name: Commit exact generator output back to the PR branch
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/derived/
          if git diff --cached --quiet; then
            echo "derived output already fresh; nothing to commit"
          else
            git commit -m "docs(derived): regenerate ID_CROSSREF.md with the repository generator (CI Python 3.11)" -m "Exact byte output of python tools/docs/build_docs.py on the PR #46 tree, produced and committed by the temporary diagnostic workflow. No hand edits. Refs #7"
            git push origin HEAD:rfc/0020-stage1-wb-clause-set
          fi

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcos-id-crossref-diagnostic
          path: /tmp/fcos-id-crossref-diagnostic/
